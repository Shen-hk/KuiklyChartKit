<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
    >
    <meta name="theme-color" content="#08111F">
    <title>Kuikly ChartKit · P0 Showcase</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #08111f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(circle at 15% 0%, rgba(47, 128, 237, 0.18), transparent 36%),
                #08111f;
            overscroll-behavior: none;
        }

        input:focus {
            outline: none;
        }
    </style>
</head>
